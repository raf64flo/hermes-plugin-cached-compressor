name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The version the plugin declares in plugin.yaml, the current release line, and the
          # moving target it will meet.
          - hermes_ref: v0.23.0
            experimental: false
          - hermes_ref: v0.23.1
            experimental: false
          - hermes_ref: main
            experimental: true
    runs-on: ubuntu-latest
    # A break on main is information, not a gate: the release line stays the declared minimum.
    continue-on-error: ${{ matrix.experimental }}
    env:
      HERMES_REF: ${{ matrix.hermes_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.14 has no pillow wheel on this runner; 3.12 runs the unit tests fine.
          python-version: "3.12"

      - name: Clone Hermes at the declared minimum version
        run: git clone --depth 1 --branch "$HERMES_REF" https://github.com/NousResearch/hermes-agent "$RUNNER_TEMP/hermes-agent"

      # Hermes' editable install does not pull every module the plugin reaches at import time
      # (ruamel.yaml is gated to >= 3.14, requests and httpx are imported lazily), so add those.
      - name: Install Hermes and the test runner
        run: pip install -e "$RUNNER_TEMP/hermes-agent" pytest ruamel.yaml requests httpx psutil

      - name: Unit tests
        env:
          HERMES_SOURCE: ${{ runner.temp }}/hermes-agent
        run: python -m pytest tests -q
